    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (!desc || !desc.set) {
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return _origFetch; },
                set: function(fn) { _origFetch = fn; },
                configurable: true,
                enumerable: true
              });
            } catch (err) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() { return _origFetch; },
                  set: function(fn) { _origFetch = fn; },
                  configurable: true,
                  enumerable: true
                });
              } catch (err2) {}
            }
          }
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (event && event.message && (event.message.indexOf('fetch') !== -1 || event.message.indexOf('Cannot set property') !== -1)) {
            if (event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          }
        }, true);
      })();
    </script>
