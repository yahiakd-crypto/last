<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punchline — BUILDER LP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { accent: '#3EE8A6', accentDark: '#2FBF8F', ink: '#E8EDF8', card: '#131C2E' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };

  <link rel="stylesheet" href="assets/css/styles.css">
