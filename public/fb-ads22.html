<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punchline — Meta Ads Intelligence Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { accent: '#1877F2', accentDark: '#145DBF', ink: '#1C1C1E', card: '#F7F8F7' }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };
  </script>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/fb-ads22.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="page-bg">
    <div class="canvas">
      <header class="site-nav"><div id="app-nav"></div></header>

      <main>
        <div class="fba-frame">
          <aside class="fba-sidebar" id="fba-sidebar" aria-label="Meta Ads modules"></aside>
          <div class="fba-main">
            <div class="fba-topbar" id="fba-topbar"></div>
            <div id="fba-content"></div>
          </div>
        </div>
      </main>

      <footer class="pt-6 mt-8 flex flex-wrap items-center justify-between gap-2 border-t border-[#ECECEE] text-[11.5px] text-[#B5B5BB]">
        <span>Punchline — AI Marketing Intelligence · Meta Ads Intelligence Center</span>
        <span id="fba-backend" class="pill gray">Detecting backend…</span>
        <span>DATA → INSIGHT → HYPOTHESIS → TEST → RESULT → LEARNING → OPTIMIZATION</span>
      </footer>
    </div>
  </div>

  <div id="fba-drawer-mask"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/fb-ads22.js"></script>
</body>
</html>
